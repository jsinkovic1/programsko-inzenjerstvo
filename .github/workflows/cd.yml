name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6.0.0
        
      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Build with Docker
        run: |
          mkdir build
          docker build -f Dockerfile -o type=oci,dest=build/charter-httpserver --tag charter/http-server:latest .
      
      - name: Upload image to AWS server
        uses: nogsantos/scp-deploy@master
        with:
          src: "build/charter-httpserver"
          host: "ec2-16-192-213-81.eu-north-1.compute.amazonaws.com"
          remote: "/home/ubuntu/charter-httpserver"
          port: "22"
          user: "ubuntu"
          key: ${{ secrets.SERVER_LOGIN }}
          
      - name: Load image and restart HTTP server
        uses: appleboy/ssh-action@v1
        with:
          host: "ec2-16-192-213-81.eu-north-1.compute.amazonaws.com"
          username: "ubuntu"
          key: ${{ secrets.SERVER_LOGIN }}
          port: "22"
          script: |
            sudo docker stop charter-http-server
            sudo docker load -i charter-httpserver
            sudo docker run -d --name charter-http-server --rm -p 5201:8080 -p 8080:5173 charter/http-server:latest sh /root/entrypoint.sh
